[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-orchestration-gateway"
version = "0.1.0"
description = "Self-hosted gateway for authorized service lifecycles and user-defined agent workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "mcp-contextforge-gateway==1.1.0",
  "dbos==3.4.0",
  "agent-client-protocol>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[project.scripts]
aog = "aog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
